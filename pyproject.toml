[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "everythingconverter"
version = "0.1.0"
description = "Convert (almost) any file into (almost) any other file, with a GUI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "The Everything Converter" }]
dependencies = [
    "Pillow>=10.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pymupdf>=1.23",
    "imageio-ffmpeg>=0.4.9",
    "mammoth>=1.6",
    "markdown>=3.5",
    "html2text>=2024.2",
    "fpdf2>=2.7",
    "pyyaml>=6.0",
    "tomli-w>=1.0",
    "tomli>=2.0 ; python_version < '3.11'",
    "svglib>=1.5",
    "reportlab>=4.0",
]

[project.optional-dependencies]
full = [
    "pillow-heif>=0.13",
    "pyarrow>=14.0",
    "lxml>=4.9",
    "tabulate>=0.9",
    "tkinterdnd2>=0.4",
]
dev = ["pytest>=7.0", "python-docx>=1.1"]
build = ["pyinstaller>=6.0"]

[tool.setuptools.package-data]
everythingconverter = ["assets/fonts/*"]

[project.scripts]
everythingconverter = "everythingconverter.cli:main"

[project.gui-scripts]
everythingconverter-gui = "everythingconverter.gui:launch"

[tool.setuptools.packages.find]
include = ["everythingconverter*"]
